<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A visual canvas for designing, linking, and simulating business logic." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233458d6'/%3E%3Crect x='9' y='9' width='3' height='14' rx='1.5' fill='white'/%3E%3Crect x='14.5' y='6' width='3' height='20' rx='1.5' fill='white'/%3E%3Crect x='20' y='12' width='3' height='10' rx='1.5' fill='white'/%3E%3C/svg%3E"
    />
    <title>Blueprint</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      try {
        var t = localStorage.getItem("blueprint-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Dev stack: Postgres + Django. Run the frontend separately with `npm run dev` in ./frontend.
services:
  db:
    image: postgres:16
    environment: {POSTGRES_DB: blueprint, POSTGRES_USER: blueprint, POSTGRES_PASSWORD: blueprint}
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DEBUG: "1"
      SECRET_KEY: dev-only
      DATABASE_URL: postgres://blueprint:blueprint@db:5432/blueprint
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: [db]
    ports: ["8000:8000"]
    command: sh -c "python manage.py makemigrations projects && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
volumes:
  pgdata:
